name: DCP Stage 9 Layer C Reconciliation
on:
  push:
    branches:
      - dcp-stage9-layerc-reconciliation-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated test dependencies
        run: python -m pip install 'beautifulsoup4>=4.12,<5' 'fastapi>=0.110,<1' 'httpx>=0.27,<1'
      - name: Syntax and import smoke
        run: |
          python -B -m py_compile dcp_stage9_mock_linux_runner.py test_dcp_stage9_mock_linux_runner.py test_dcp_stage9_safety_closure.py polaris_dealer_cart_session_adapter.py polaris_dealer_cart_dom.py polaris_dealer_cart_contract.py test_polaris_cart_session_layer_c.py test_polaris_cart_dom_layer_a.py test_polaris_dealer_cart_contract.py
          python -B -c 'import dcp_stage9_mock_linux_runner; import polaris_dealer_cart_session_adapter; import polaris_dealer_cart_dom; import polaris_dealer_cart_contract'
      - name: Stage 9 13 plus Polaris 61 exact suites
        run: |
          python -B -m unittest -v \
            test_dcp_stage9_mock_linux_runner.py \
            test_dcp_stage9_safety_closure.py \
            test_polaris_cart_session_layer_c.py \
            test_polaris_cart_dom_layer_a.py \
            test_polaris_dealer_cart_contract.py
