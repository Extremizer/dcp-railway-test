name: P0 Procenka OEM Mixed Mode Isolated
on:
  push:
    branches:
      - theme4-p0-oem-mixed-mode-fix-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-oem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install regression dependencies
        run: python -m pip install -r requirements.txt pytest beautifulsoup4
      - name: Compile/import
        run: |
          python -B -m compileall -q extremizer_bot.py test_procenka_mixed_mode_p0.py
          python -B -c "import extremizer_bot"
      - name: P0 handler and adjacent regression
        run: |
          python -B -m pytest -q test_procenka_mixed_mode_p0.py test_manufacturer_first_three_bots.py test_procenka_dp_bridge.py test_procenka_partial_parts_bridge.py
      - name: Verify Probnik unchanged by this isolated patch
        run: |
          git diff --exit-code d05827268039c40c7cb7f2f920c06c31a760c9f0 HEAD -- probnik_app.py
