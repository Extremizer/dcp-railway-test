name: WEB2 Procenka Checkout Isolated

on:
  push:
    branches:
      - web2-procenka-checkout-integration-20261014
      - web2-unified-procenka-owner-staging-20261014
      - web2-powersports-integration-prep-20261015
      - web2-client-functional-hardening-20261016
      - web2-oem-search-ux-m1-20261017
      - web2-product-card-ux-m2-20261017
      - web2-cart-ux-m3-20261017
      - web2-mobile-responsive-m4-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax smoke
        run: |
          python -m py_compile             web_handoff.py             client_checkout_callback_adapter.py             client_checkout_orchestrator.py             client_order_finance_bridge.py             test_web2_procenka_checkout_e2e.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path("extremizer_bot.py").read_text(encoding="utf-8-sig"))
          ast.parse(Path("web_app.py").read_text(encoding="utf-8-sig"))
          PY

      - name: WEB2 to Procenka isolated E2E
        run: python -B -m unittest -v test_web2_procenka_checkout_e2e.py

      - name: Existing atomic checkout regressions
        run: |
          python -B _client_checkout_orchestrator_regression.py
          python -B _client_checkout_callback_adapter_regression.py
          python -B _save_order_shared_tx_regression.py

      - name: Existing WEB2 contract regression
        run: python -B -m unittest -v test_web2_contract.py
