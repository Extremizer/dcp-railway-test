name: Theme1 OEMixi Admin Polaris Readonly
on:
  push:
    branches:
      - theme1-oemixi-admin-polaris-readonly-wiring-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 websocket-client playwright
      - run: python -B -m py_compile oemixi_admin_polaris_cart_price.py reconciliation/oemixibot_app.py
      - run: python -B -m unittest -v test_oemixi_admin_polaris_cart_price.py test_polaris_dealer_session_identity_guard.py test_polaris_layer_c_runtime_wiring.py test_polaris_cart_session_layer_c.py test_polaris_cart_dom_layer_a.py test_polaris_dealer_cart_contract.py
      - run: python -B -m unittest -v reconciliation.test_admin_reconciliation reconciliation.test_admin_handlers reconciliation.test_finance_navigation
