name: WEB2 POWERSPORTS PR50 Selective Release Gate

on:
  push:
    branches:
      - release-web2-powersports-pr50-selective-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact production ancestry and selective boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=635c7673f3247d44499ace3c10b0723a3c6f68df
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            ".github/workflows/web2-powersports-pr50-selective-release.yml",
            "test_web2_powersports_visual.py",
            "test_web2_staging.py",
            "web2/app.js",
            "web2/index.html",
            "web2/styles.css",
            "web2_ui_routes.py",
            "web2/assets/POWERSPORTS_GARAGE_SHARP_SOURCE.png",
            "web2/assets/EXTREMIZER_WEB_WORDMARK_TEMPLATE_V1.png",
          }
          changed=set(Path("/tmp/changed.txt").read_text().splitlines())
          extra=sorted(changed-allowed)
          missing={"web2/app.js","web2/index.html","web2/styles.css","web2_ui_routes.py"}-changed
          if extra:
              raise SystemExit("FORBIDDEN_SELECTIVE_FILES: " + ", ".join(extra))
          if missing:
              raise SystemExit("MISSING_PR50_RUNTIME_FILES: " + ", ".join(sorted(missing)))
          print("PR50_SELECTIVE_BOUNDARY_PASS")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "httpx>=0.27,<1" beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Exact POWERSPORTS asset SHA guard
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '24b1f57e51142cdd385d33a585f3b72b6706b64188eba5830508eedbe5b11a48' 'web2/assets/POWERSPORTS_GARAGE_SHARP_SOURCE.png' | sha256sum -c -
          printf '%s  %s\n' 'ac993368c8f07e3f635526dcb296003fa12c8b6f0835fab5744eedab91c0fecb' 'web2/assets/EXTREMIZER_WEB_WORDMARK_TEMPLATE_V1.png' | sha256sum -c -
          echo "POWERSPORTS_ASSET_SHA_PASS"

      - name: Syntax and import smoke
        run: |
          python -B -m py_compile web2_staging_app.py web2_ui_routes.py web2_runtime_app.py
          node --check web2/app.js
          python -B - <<'PY'
          import web_app
          assert web_app.app is not None
          print("IMPORT_SMOKE_PASS")
          PY

      - name: PR50 visual and WEB2 M1-M4 regression
        run: |
          python -B -m unittest -v \
            test_web2_powersports_visual.py \
            test_web2_staging.py \
            test_web2_host_integration.py \
            test_web2_browser.py \
            test_web2_ui_routes.py \
            test_web2_contract.py \
            test_web2_client_mvp.py \
            test_web2_functional_hardening.py \
            test_web2_search_ux_m1.py \
            test_web2_product_card_m2.py \
            test_web2_cart_m3.py \
            test_web2_mobile_m4.py

      - name: Warehouse-only cart hotfix guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q "warehouseOnlyIdentity" web2/app.js
          python -B -m unittest -v test_web2_browser.py test_web2_cart_m3.py
          echo "WAREHOUSE_ONLY_CART_HOTFIX_PRESERVED"

      - name: Polaris regression unchanged
        run: |
          python -B -m unittest -v \
            test_oemixi_admin_browser_provider.py \
            test_admin_browser_orchestration.py \
            test_polaris_production_authority.py \
            test_oemixi_admin_polaris_production.py \
            test_polaris_probe_cart_transaction.py \
            test_polaris_cart_exact_actions.py \
            test_polaris_exact_add.py \
            test_polaris_probe_cart_hardening.py \
            test_polaris_probe_recovery_safety.py \
            test_polaris_dealer_session_identity_guard.py \
            test_polaris_layer_c_runtime_wiring.py \
            test_polaris_cart_session_layer_c.py \
            test_polaris_cart_dom_layer_a.py \
            test_polaris_dealer_cart_contract.py \
            test_oemixi_category_authority_transport.py \
            test_oemixi_category_authority_cross_host.py

      - name: Internal Order and finance compatibility
        run: |
          python -B -m unittest -v \
            test_warehouse_balance_v14.py \
            test_client_wallet_info_v14.py \
            test_internal_payment_atomic_v14.py \
            test_warehouse_history_v14.py \
            test_internal_order_core_v01.py \
            test_internal_order_read_v01.py \
            test_internal_order_p4_terms.py \
            test_internal_order_p5_boundary.py \
            test_partner_routes_checkout_point10.py \
            test_warehouse_partner_settlements_point10.py \
            test_dealer_prepaid_finance.py \
            test_oemixibot_prepaid_runtime.py
          python -B _atomic_client_finance_regression.py
          python -B _save_order_shared_tx_regression.py
          python -B _client_checkout_orchestrator_regression.py
          python -B _client_checkout_callback_adapter_regression.py

      - name: Routing and entrypoint guards
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from common_finance_contract import PaymentRoute, default_client_payment_route
          assert default_client_payment_route("usa") is PaymentRoute.EXTREMIZER_BALANCE
          assert default_client_payment_route("warehouse") is PaymentRoute.EXTREMIZER_BALANCE
          print("GLOBAL_ROUTING_UNCHANGED_PASS")
          PY
          BASE=635c7673f3247d44499ace3c10b0723a3c6f68df
          for f in web_app.py web1_runtime.py oemixibot_app.py probnik_app.py; do
            git diff --quiet "$BASE"...HEAD -- "$f" || {
              echo "PRODUCTION_ENTRYPOINT_CHANGED: $f"
              exit 1
            }
          done
          echo "NO_PRODUCTION_ENTRYPOINT_DELTA"

      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr50-selective-visual-evidence
          path: |
            artifacts/*.png
            artifacts/mobile-m4/*.png
          if-no-files-found: error
