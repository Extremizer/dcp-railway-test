name: Theme1 Polaris Dealer Cart Session Layer C
on:
  push:
    branches:
      - theme1-polaris-cart-readonly-layer-c-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5'
      - run: python -B -m py_compile polaris_dealer_cart_session_adapter.py test_polaris_cart_session_layer_c.py polaris_dealer_cart_dom.py polaris_dealer_cart_contract.py
      - run: python -B -m unittest -v test_polaris_cart_session_layer_c.py test_polaris_cart_dom_layer_a.py test_polaris_dealer_cart_contract.py
