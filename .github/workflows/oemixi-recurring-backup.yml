name: OEMixi recurring backup
on:
  push:
    branches: [fix/oemixi-recurring-backup-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_BASE_SHA: d05827268039c40c7cb7f2f920c06c31a760c9f0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact HEAD and isolated scope
        run: |
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git diff --check c0b06c27aced8b9024178ede2f01f9d04bb3c333 HEAD
          python - <<'PY'
          import subprocess
          allowed = {'oemixi_recurring_backup.py', 'oemixibot_railway_runtime.py', 'test_oemixi_recurring_backup.py', '.github/workflows/oemixi-recurring-backup.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'c0b06c27aced8b9024178ede2f01f9d04bb3c333', 'HEAD'], text=True).splitlines())
          assert changed == allowed, changed
          PY
      - run: python -m pip install -r requirements.txt pytest httpx beautifulsoup4
      - name: Backup safety, restore, runtime and price regressions
        run: >-
          python -B -m unittest -v
          test_oemixi_recurring_backup test_oemixibot_railway_runtime
          test_ski_doo_exact_gateway_release_candidate test_dcp_authenticated_parts_search
          test_oemixi_secure_gateway_transport test_unified_price_contract_v1 test_dcp_three_adapters test_polaris_consumer_pricesource
          test_ski_doo_gateway_bot_acceptance
          test_dp_result_completion test_dcp_admission test_dcp_stage3_consistency test_dcp_producer_v2 test_dcp_release_rehearsal
          test_ski_doo_release_compatibility
