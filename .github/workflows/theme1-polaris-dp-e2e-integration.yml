name: Theme1 Polaris Dealer Price E2E Integration

on:
  push:
    branches:
      - theme1-polaris-dp-e2e-integration-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact selective boundary from requested production baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=635c7673f3247d44499ace3c10b0723a3c6f68df
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"...HEAD | sort | tee /tmp/theme1-files.txt
          python - <<'PY'
          from pathlib import Path
          allowed={
            ".github/workflows/theme1-polaris-dp-e2e-release-candidate.yml",
            ".github/workflows/theme1-polaris-dp-e2e-integration.yml",
            "dcp_price_gateway.py",
            "dp_live_bridge.py",
            "dp_result_completion.py",
            "dp_sync_agent.py",
            "extremizer_bot.py",
            "oemixi_admin_polaris_browser_price.py",
            "oemixibot_dcp_price.py",
            "polaris_dealer_cart_completion_contract.py",
            "probnik_app.py",
            "test_polaris_dealer_cart_completion_contract.py",
            "test_polaris_dp_e2e_integration.py",
            "test_polaris_consumer_pricesource.py",
            "unified_price_contract_v1.py",
            "test_oemixibot_railway_runtime.py",
            "test_unified_price_contract_v1.py",
          }
          changed=set(Path("/tmp/theme1-files.txt").read_text().splitlines())
          extra=sorted(changed-allowed)
          if extra:
              raise SystemExit("FORBIDDEN_THEME1_FILES: "+", ".join(extra))
          required={
            "dcp_price_gateway.py","dp_result_completion.py","dp_sync_agent.py",
            "oemixi_admin_polaris_browser_price.py","oemixibot_dcp_price.py",
            "polaris_dealer_cart_completion_contract.py",
            "test_polaris_dp_e2e_integration.py",
          }
          missing=sorted(required-changed)
          if missing:
              raise SystemExit("MISSING_THEME1_FILES: "+", ".join(missing))
          print("THEME1_SELECTIVE_BOUNDARY_PASS")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "httpx>=0.27,<1" beautifulsoup4 websocket-client playwright
          python -m playwright install --with-deps chromium

      - name: Syntax and import
        run: |
          python -B -m py_compile             dcp_price_gateway.py             dp_result_completion.py             dp_sync_agent.py             oemixi_admin_polaris_browser_price.py             oemixibot_dcp_price.py             polaris_dealer_cart_completion_contract.py             extremizer_bot.py probnik_app.py             test_polaris_dp_e2e_integration.py
          python -B - <<'PY'
          import dcp_price_gateway, dp_result_completion, dp_sync_agent
          import oemixi_admin_polaris_browser_price, oemixibot_dcp_price
          import extremizer_bot, probnik_app, web_app
          assert web_app.app is not None
          print("IMPORT_PASS")
          PY

      - name: Polaris production-shaped E2E and completion
        run: |
          python -B -m unittest -v             test_polaris_dp_e2e_integration.py             test_polaris_dealer_cart_completion_contract.py             test_polaris_production_authority.py             test_polaris_dealer_cart_contract.py

      - name: Signed protocol v2 and cross-host fencing
        run: |
          python -B -m unittest -v             test_polaris_dp_e2e_integration.py             test_oemixi_category_authority_cross_host.py             test_oemixi_category_authority_transport.py

      - name: Polaris browser proof and restoration regressions
        run: |
          python -B -m unittest -v             test_polaris_exact_add.py             test_polaris_probe_cart_transaction.py             test_polaris_probe_cart_hardening.py             test_polaris_probe_recovery_safety.py             test_polaris_dealer_session_identity_guard.py             test_polaris_layer_c_runtime_wiring.py             test_polaris_cart_session_layer_c.py             test_polaris_cart_dom_layer_a.py             test_admin_browser_orchestration.py             test_oemixi_admin_polaris_production.py

      - name: Common PriceSource and consumer regressions
        run: |
          python -B -m unittest -v             test_polaris_consumer_pricesource.py             test_procenka_dp_bridge.py             test_oemixibot_railway_runtime.py
          # This fixture patches process environment before importing web_app/core.
          # Its own header requires a fresh interpreter.
          python -B -m unittest -v test_web2_host_integration.py

      - name: Non-Polaris and no-MSRP fallback regressions
        run: |
          # Current-contract suites: Category Authority + Stage2 fail-closed.
          # Legacy pre-authority queue fixtures are baseline debt on current production.
          python -B -m unittest -v             test_oemixi_admin_browser_provider.py             test_theme1_stage2_runtime_boundary.py             test_theme1_stage2_target.py             test_unified_price_contract_v1.py             test_startup_safety.py
          python -B - <<'PY'
          from dp_result_completion import MANUFACTURERS
          for m in ("Arctic Cat","Can-Am","Sea-Doo","Ski-Doo","Yamaha"):
              assert m in MANUFACTURERS
          print("NON_POLARIS_CURRENT_CONTRACT_PASS")
          PY

      - name: Finance and Internal Order compatibility
        run: |
          python -B -m unittest -v             test_warehouse_balance_v14.py             test_client_wallet_info_v14.py             test_internal_payment_atomic_v14.py             test_warehouse_history_v14.py             test_internal_order_core_v01.py             test_internal_order_read_v01.py             test_internal_order_p4_terms.py             test_internal_order_p5_boundary.py             test_partner_routes_checkout_point10.py             test_warehouse_partner_settlements_point10.py             test_dealer_prepaid_finance.py             test_oemixibot_prepaid_runtime.py
          python -B _atomic_client_finance_regression.py
          python -B _save_order_shared_tx_regression.py
          python -B _client_checkout_orchestrator_regression.py
          python -B _client_checkout_callback_adapter_regression.py

      - name: WEB2 core compatibility
        run: |
          # Browser suites intentionally run in fresh interpreters to avoid
          # Playwright sync/async loop and browser-lifecycle contamination.
          python -B -m unittest -v test_web2_contract.py
          python -B -m unittest -v test_web2_client_mvp.py
          python -B -m unittest -v test_web2_functional_hardening.py
          python -B -m unittest -v test_web2_search_ux_m1.py
          python -B -m unittest -v test_web2_product_card_m2.py
          python -B -m unittest -v test_web2_cart_m3.py
          python -B -m unittest -v test_web2_mobile_m4.py
          python -B -m unittest -v test_web2_host_integration.py

      - name: No forbidden release-scope changes
        shell: bash
        run: |
          set -euo pipefail
          BASE=635c7673f3247d44499ace3c10b0723a3c6f68df
          changed="$(git diff --name-only "$BASE"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Ei '(^|/)web2/|finance|internal_order|wops|bulk|customs|migration' >/dev/null; then
            echo "FORBIDDEN_SCOPE_CHANGE"
            exit 1
          fi
          for f in web1_runtime.py oemixibot_app.py railway.json; do
            git diff --quiet "$BASE"...HEAD -- "$f" || {
              echo "UNRELATED_ENTRYPOINT_CHANGE: $f"
              exit 1
            }
          done
          echo "RELEASE_SCOPE_GUARD_PASS"
