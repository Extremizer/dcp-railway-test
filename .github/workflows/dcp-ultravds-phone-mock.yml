name: DCP UltraVDS PHONE-FIRST Mock-Only CI
on:
  push:
    branches: [fix/dcp-phone-volume-ownership-20261025]
    paths:
      - dcp_phone_ultravds_mock.py
      - dcp_phone_staging_app.py
      - dcp_phone_staging_mock.html
      - dcp_phone_recovery_core.py
      - dcp_phone_recovery_app.py
      - dcp_phone_recovery_notice.py
      - dcp_phone_staging_notice_once.py
      - test_dcp_phone_ultravds_mock.py
      - test_dcp_phone_recovery.py
      - test_dcp_phone_staging_identity.py
      - test_dcp_phone_staging_notice_once.py
      - .github/workflows/dcp-ultravds-phone-mock.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install local test dependencies
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'uvicorn>=0.34,<1' 'websocket-client>=1.9,<2' 'pytest>=8,<10'
      - name: Compile PHONE-FIRST files
        run: python -m py_compile dcp_phone_ultravds_mock.py dcp_phone_staging_app.py dcp_phone_recovery_app.py dcp_phone_recovery_core.py dcp_phone_recovery_notice.py dcp_phone_staging_notice_once.py test_dcp_phone_ultravds_mock.py
      - name: Fail-closed mock and security tests (no browser or supplier access)
        run: python -B -m pytest -q test_dcp_phone_ultravds_mock.py test_dcp_phone_recovery.py test_dcp_phone_staging_identity.py test_dcp_phone_staging_notice_once.py
      - name: Verify no unsafe Chromium flags or public bind in VPS launcher
        shell: python
        run: |
          from pathlib import Path
          code=Path("dcp_phone_ultravds_mock.py").read_text()
          assert "--no-sandbox" not in code
          assert "--disable-setuid-sandbox" not in code
          assert "--disable-seccomp-filter-sandbox" not in code
          assert 'host="127.0.0.1"' in code
          assert '"--remote-debugging-address=127.0.0.1"' in code
          assert "www.dealercostparts.com" not in code
          print("ULTRAVDS_MOCK_SAFETY_CONTRACT_PASS")
