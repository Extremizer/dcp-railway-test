name: EXTREMIZER Combined RC2 Release Gate

on:
  push:
    branches:
      - release-control-combined-rc2-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-rc2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Exact RC1 ancestry and composition boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=757d6b773bac1c5dd25f5360bce5535fefddf1e2
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"...HEAD | sort > /tmp/changed.txt
          cat /tmp/changed.txt
          python - <<'PY'
          from pathlib import Path
          allowed = {
            ".github/workflows/combined-rc2-release-gate.yml",
            ".github/workflows/web2-m4-selective-release.yml",
            ".github/workflows/internal-order-p5-selective-release.yml",
            "EXTREMIZER_WEB2_M4_SELECTIVE_RELEASE_20261017.md",
            "EXTREMIZER_INTERNAL_ORDER_P5_SELECTIVE_RELEASE_20261017.md",
            "EXTREMIZER_BACKUP_TRANSPORT_GATE_20261017.md",
            "release_artifacts/backup_transport/RUN_EXTREMIZER_BACKUP_AUTO.cmd",
            "test_web2_cart_m3.py","test_web2_client_mvp.py",
            "test_web2_functional_hardening.py","test_web2_mobile_m4.py",
            "test_web2_product_card_m2.py","test_web2_search_ux_m1.py",
            "test_web2_staging.py","web2/app.js","web2/index.html","web2/styles.css",
            "web2_staging_app.py","web2_ui_routes.py",
            "client_wallet_info_v14.py","common_finance_contract.py",
            "internal_order_core_v01.py","internal_order_p5_boundary.py",
            "internal_order_read_v01.py","internal_order_terms_v01.py",
            "test_client_wallet_info_v14.py","test_internal_order_core_v01.py",
            "test_internal_order_p4_terms.py","test_internal_order_p5_boundary.py",
            "test_internal_order_read_v01.py","test_internal_payment_atomic_v14.py",
            "test_warehouse_balance_v14.py","test_warehouse_history_v14.py",
            "warehouse_balance_v14.py","warehouse_history_v14.py",
          }
          changed=set(Path("/tmp/changed.txt").read_text().splitlines())
          extra=sorted(changed-allowed)
          if extra:
              raise SystemExit("FORBIDDEN_COMBINED_RC_FILES: " + ", ".join(extra))
          print("COMBINED_RC_BOUNDARY_PASS")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "httpx>=0.27,<1" beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Syntax and import smoke
        run: |
          python -B -m py_compile             polaris_cart_snapshot.py polaris_probe_cart_recovery.py             polaris_probe_cart_transaction.py polaris_probe_errors.py             polaris_probe_cart_delta.py polaris_cart_mutation_adapter.py             polaris_cart_exact_actions.py polaris_cart_existing_cdp_actions.py             polaris_add_form_contract.py polaris_add_existing_session.py             polaris_existing_browser_controller.py oemixi_admin_polaris_browser_price.py             oemixi_category_authority_client.py oemixi_category_authority_transport.py             oemixi_admin_polaris_production.py polaris_production_authority_seed.py             oemixibot_app.py             web2_staging_app.py web2_ui_routes.py web2_runtime_app.py             internal_order_core_v01.py internal_order_read_v01.py             internal_order_terms_v01.py internal_order_p5_boundary.py             client_wallet_info_v14.py warehouse_balance_v14.py warehouse_history_v14.py             common_finance_contract.py
          node --check web2/app.js
          python -B - <<'PY'
          import web_app
          import internal_order_core_v01, internal_order_read_v01
          import internal_order_terms_v01, internal_order_p5_boundary
          assert web_app.app is not None
          print("COMBINED_IMPORT_SMOKE_PASS")
          PY

      - name: Polaris exact regression
        run: |
          python -B -m unittest -v             test_oemixi_admin_browser_provider.py             test_admin_browser_orchestration.py             test_polaris_production_authority.py             test_oemixi_admin_polaris_production.py             test_polaris_probe_cart_transaction.py             test_polaris_cart_exact_actions.py             test_polaris_exact_add.py             test_polaris_probe_cart_hardening.py             test_polaris_probe_recovery_safety.py             test_polaris_dealer_session_identity_guard.py             test_polaris_layer_c_runtime_wiring.py             test_polaris_cart_session_layer_c.py             test_polaris_cart_dom_layer_a.py             test_polaris_dealer_cart_contract.py             test_oemixi_category_authority_transport.py             test_oemixi_category_authority_cross_host.py

      - name: WEB2 M1 through M4 and host regression
        run: |
          python -B -m unittest -v             test_web2_staging.py             test_web2_host_integration.py             test_web2_browser.py             test_web2_ui_routes.py             test_web2_contract.py             test_web2_client_mvp.py             test_web2_functional_hardening.py             test_web2_search_ux_m1.py             test_web2_product_card_m2.py             test_web2_cart_m3.py             test_web2_mobile_m4.py

      - name: Internal Order P5 and finance compatibility regression
        run: |
          python -B -m unittest -v             test_warehouse_balance_v14.py             test_client_wallet_info_v14.py             test_internal_payment_atomic_v14.py             test_warehouse_history_v14.py             test_internal_order_core_v01.py             test_internal_order_read_v01.py             test_internal_order_p4_terms.py             test_internal_order_p5_boundary.py             test_partner_routes_checkout_point10.py             test_warehouse_partner_settlements_point10.py             test_dealer_prepaid_finance.py             test_oemixibot_prepaid_runtime.py
          python -B _atomic_client_finance_regression.py
          python -B _save_order_shared_tx_regression.py
          python -B _client_checkout_orchestrator_regression.py
          python -B _client_checkout_callback_adapter_regression.py

      - name: Routing safety guard
        run: |
          python -B - <<'PY'
          from common_finance_contract import PaymentRoute, default_client_payment_route
          assert default_client_payment_route("usa") is PaymentRoute.EXTREMIZER_BALANCE
          assert default_client_payment_route("warehouse") is PaymentRoute.EXTREMIZER_BALANCE
          print("GLOBAL_ROUTING_UNCHANGED_PASS")
          PY

      - name: Production entrypoint delta guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=757d6b773bac1c5dd25f5360bce5535fefddf1e2
          for f in web_app.py web1_runtime.py oemixibot_app.py probnik_app.py; do
            git diff --quiet "$BASE"...HEAD -- "$f" || {
              echo "PRODUCTION_ENTRYPOINT_CHANGED: $f"
              exit 1
            }
          done
          echo "NO_NEW_PRODUCTION_ENTRYPOINT_DELTA"

      - name: Railway startup smoke
        run: |
          python -B -c "import web_app; assert web_app.app is not None; print('WEB_APP_IMPORT_OK')"

      - name: Upload WEB2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: combined-rc2-web2-screenshots
          path: |
            artifacts/*.png
            artifacts/mobile-m4/*.png
          if-no-files-found: error
