name: Theme1 Arctic Cat Reference Weight
on:
  push:
    branches:
      - theme1-arcticcat-reference-calculation-weight-20261017
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-weight-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-telegram-bot beautifulsoup4 websocket-client
      - run: python -B -m py_compile oem_reference_service.py oemixibot_catalog.py oemixibot_telegram.py oemixibot_app.py web_app.py extremizer_bot.py test_arcticcat_reference_calculation_weight.py
      - run: python -B -m unittest -v test_arcticcat_reference_calculation_weight
