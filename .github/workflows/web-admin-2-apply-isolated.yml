name: WEB ADMIN 2 Apply Isolated Regression
on:
  pull_request:
    branches: [probnik-runtime-20261005]
  workflow_dispatch:
jobs:
  isolated-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile admin_order_apply_service.py admin_order_service.py stock_engine.py supplier_admin_auth.py test_web_admin_2_apply_isolated.py test_web_admin_2_apply_csrf.py
      - name: Isolated SQLite transaction tests
        run: python -m unittest -v test_web_admin_2_apply_isolated test_web_admin_2_apply_csrf
