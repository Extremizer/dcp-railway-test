name: OEMixi Shipment P0 Source RED
on:
  push:
    branches: [oemixi-shipment-atomicity-p0-20261014]
  workflow_dispatch:
jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-level disposable SQLite regression
        run: python -m unittest discover -s tests -p 'test_oemixi_shipment_*p0.py' -v
