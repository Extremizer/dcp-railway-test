name: Theme4 Three Bots Synthetic E2E
on:
  push:
    branches:
      - theme4-p3-three-bots-e2e-isolated-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated runtime test dependencies
        run: python -m pip install -r requirements.txt pytest beautifulsoup4
      - name: Syntax and import
        run: |
          python -B -m compileall -q extremizer_bot.py probnik_app.py oemixibot_app.py test_theme4_three_bots_synthetic_e2e.py
          python -B -c "import extremizer_bot, probnik_app, oemixibot_app"
      - name: All three message handlers and adjacent guard tests
        run: |
          python -B -m pytest -q test_theme4_three_bots_synthetic_e2e.py test_procenka_mixed_mode_p0.py test_manufacturer_first_three_bots.py test_procenka_dp_bridge.py test_procenka_partial_parts_bridge.py
      - name: Keep dealer and Probnik runtime source exactly production
        run: |
          git diff --exit-code d05827268039c40c7cb7f2f920c06c31a760c9f0 HEAD -- probnik_app.py oemixibot_app.py
      - name: Show production deploy hold
        run: |
          echo "NO MERGE / NO DEPLOY / NO LIVE TELEGRAM / NO CART MUTATION"
