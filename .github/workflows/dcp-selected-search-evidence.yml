name: DCP Selected Search Evidence Contract
on:
  push:
    branches:
      - theme4-nonpolaris-dcp-search-evidence-20261019
permissions:
  contents: read
jobs:
  search-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m unittest -v test_dcp_selected_search_contract.py
