name: Theme1 DCP Dealer Session Identity Guard
on:
  push:
    branches:
      - theme1-dcp-dealer-session-identity-guard-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'beautifulsoup4>=4.12,<5' 'websocket-client>=1.7,<2' 'playwright>=1.50,<2'
      - run: python -B -m py_compile polaris_dealer_session_identity_guard.py test_polaris_dealer_session_identity_guard.py
      - run: python -B -m unittest -v test_polaris_dealer_session_identity_guard.py test_polaris_layer_c_runtime_wiring.py test_polaris_cart_session_layer_c.py test_polaris_cart_dom_layer_a.py test_polaris_dealer_cart_contract.py
