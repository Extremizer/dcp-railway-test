name: WEB2 Client MVP Isolated

on:
  push:
    branches:
      - web2-client-mvp-20261014
      - web2-client-mvp-visual-p0-20261014
      - web2-unified-procenka-owner-staging-20261014
      - web2-powersports-integration-prep-20261015
      - web2-client-functional-hardening-20261016
      - web2-oem-search-ux-m1-20261017
      - web2-product-card-ux-m2-20261017
      - web2-cart-ux-m3-20261017
      - web2-mobile-responsive-m4-20261017
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated dependencies
        run: |
          python -m pip install -r requirements.txt "httpx>=0.27,<1"
          python -m playwright install --with-deps chromium

      - name: Syntax
        run: |
          python -B -m py_compile web2_staging_app.py web2_ui_routes.py web2_runtime_app.py test_web2_staging.py test_web2_client_mvp.py test_web2_host_integration.py test_web2_functional_hardening.py test_web2_search_ux_m1.py test_web2_product_card_m2.py test_web2_cart_m3.py test_web2_mobile_m4.py
          node --check web2/app.js

      - name: Staging API regression
        run: python -B -m unittest -v test_web2_staging.py

      - name: Real WEB1 host pricing stock and handoff persistence
        run: python -B -m unittest -v test_web2_host_integration.py

      - name: Client MVP browser and visual regression
        run: python -B -m unittest -v test_web2_client_mvp.py

      - name: Functional and hostile-field security browser regression
        run: python -B -m unittest -v test_web2_functional_hardening.py

      - name: OEM search UX milestone regression
        run: python -B -m unittest -v test_web2_search_ux_m1.py

      - name: Product Card M2 browser regression
        run: python -B -m unittest -v test_web2_product_card_m2.py

      - name: Cart UX M3 browser regression
        run: python -B -m unittest -v test_web2_cart_m3.py

      - name: Mobile M4 responsive browser regression
        run: python -B -m unittest -v test_web2_mobile_m4.py

      - name: Upload M4 responsive screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web2-mobile-m4-screenshots
          path: artifacts/mobile-m4/*.png
          if-no-files-found: error

      - name: Upload MVP screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web2-client-mvp-visual-p0-screenshots
          path: artifacts/*.png
          if-no-files-found: error
