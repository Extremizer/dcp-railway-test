name: WEB2 Client MVP Isolated

on:
  push:
    branches:
      - web2-client-mvp-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install isolated dependencies
        run: |
          python -m pip install "fastapi>=0.115,<1" "uvicorn>=0.34,<1" "httpx>=0.27,<1" "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Syntax
        run: |
          python -B -m py_compile web2_staging_app.py web2_ui_routes.py test_web2_staging.py test_web2_client_mvp.py
          node --check web2/app.js

      - name: Staging API regression
        run: python -B -m unittest -v test_web2_staging.py

      - name: Client MVP browser regression
        run: python -B -m unittest -v test_web2_client_mvp.py

      - name: Upload MVP screenshots
        uses: actions/upload-artifact@v4
        with:
          name: web2-client-mvp-screenshots
          path: artifacts/*.png
          if-no-files-found: error
