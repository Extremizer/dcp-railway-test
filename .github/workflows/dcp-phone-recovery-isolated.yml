name: DCP Phone Recovery Isolated Security CI
on:
  push:
    branches:
      - theme4-dcp-phone-first-cloud-producer-20261020
  pull_request:
    paths:
      - dcp_phone_recovery_*
      - dp_cloud_producer_ownership.py
      - test_dp_cloud_producer_ownership.py
      - dcp_cloud_browser_host.py
      - test_dcp_phone_recovery.py
      - .github/workflows/dcp-phone-recovery-isolated.yml
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated requirements
        run: python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'websocket-client>=1.9,<2' 'pytest>=8,<10'
      - name: Compile all recovery modules
        run: python -m py_compile dcp_phone_recovery_core.py dcp_phone_recovery_app.py dcp_cloud_browser_host.py dp_cloud_producer_ownership.py dp_cloud_producer_client.py dp_cloud_owner_http.py dp_cloud_broker_runtime.py test_dp_cloud_producer_ownership.py test_dp_cloud_client_contract.py test_dp_cloud_broker_http.py test_dcp_phone_recovery.py
      - name: Security and recovery tests (no network)
        run: python -B -m pytest -q test_dcp_phone_recovery.py test_dp_cloud_producer_ownership.py test_dp_cloud_client_contract.py test_dp_cloud_broker_http.py
