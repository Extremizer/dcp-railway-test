name: Ski-Doo OEMixi Gateway RC Isolated

on:
  push:
    branches:
      - fix/dcp-ski-doo-gateway-core-20261024
      - fix/dcp-ski-doo-gateway-oemixi-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact commit and scope
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          case "$GITHUB_REF_NAME" in
            fix/dcp-ski-doo-gateway-core-20261024) BASE_SHA="ee4d22851036faed409f63ef405398f4fb3b1611" ;;
            fix/dcp-ski-doo-gateway-oemixi-20261024) BASE_SHA="d05827268039c40c7cb7f2f920c06c31a760c9f0" ;;
            *) exit 44 ;;
          esac
          export BASE_SHA
          echo "RELEASE_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --check "$BASE_SHA" HEAD
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          allowed = {
              "dcp_price_gateway.py",
              "test_ski_doo_exact_gateway_release_candidate.py",
              "test_ski_doo_gateway_bot_acceptance.py",
              "dcp_isolated_category_fixture.py",
              "test_dcp_three_adapters.py",
              "test_oemixi_secure_gateway_transport.py",
              "test_polaris_consumer_pricesource.py",
              "test_polaris_dp_e2e_integration.py",
              ".github/workflows/ski-doo-gateway-rc-isolated.yml",
          }
          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
              text=True
          ).splitlines())
          assert changed == allowed, (changed, allowed)
          for name in changed:
              assert Path(name).is_file(), name
          PY
      - name: Install isolated regression dependencies
        run: python -m pip install -r requirements.txt pytest httpx beautifulsoup4
      - name: Syntax and import smoke
        run: |
          python -B -m compileall -q dcp_price_gateway.py oemixi_secure_gateway_transport.py oemixibot_catalog.py
          python -B -c "import dcp_price_gateway, oemixi_secure_gateway_transport"
      - name: Exact Ski-Doo proof and fail-closed matrix
        run: python -B -m unittest -v test_ski_doo_exact_gateway_release_candidate.py test_dcp_authenticated_parts_search.py
      - name: Shared gateway and Polaris strict regression
        run: python -B -m unittest -v test_oemixi_secure_gateway_transport.py test_unified_price_contract_v1.py test_dcp_three_adapters.py test_polaris_consumer_pricesource.py
      - name: Ski-Doo signed gateway to actual bot reply (offline)
        run: python -B test_ski_doo_gateway_bot_acceptance.py
      - name: Corrected regression fixtures on unchanged release base
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/clean-base" "$RELEASE_BASE_SHA"
          # Use the same corrected tests on both versions; never overlay runtime.
          for path in dcp_isolated_category_fixture.py test_dcp_three_adapters.py test_oemixi_secure_gateway_transport.py test_polaris_consumer_pricesource.py test_polaris_dp_e2e_integration.py; do
            cp "$path" "$RUNNER_TEMP/clean-base/$path"
          done
          git -C "$RUNNER_TEMP/clean-base" diff --exit-code -- '*.py' ':!dcp_isolated_category_fixture.py' ':!test_*.py'
          cd "$RUNNER_TEMP/clean-base"
          python -B -m unittest -v test_oemixi_secure_gateway_transport.py test_unified_price_contract_v1.py test_dcp_three_adapters.py test_polaris_consumer_pricesource.py
