name: DCP Health Core CI

on:
  push:
    branches:
      - dcp-health-core-20261008
      - dcp-health-core-prod-20261008
  pull_request:
    branches:
      - main
      - probnik-runtime-20261005

jobs:
  dcp-health-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: |
          python -m py_compile             dp_live_health.py             dp_live_bridge.py             web_app.py             oemixibot_dcp_price.py             extremizer_bot.py             dp_sync_agent.py             test_dcp_health_core.py             test_dcp_reliability.py             test_procenka_dp_bridge.py             test_procenka_partial_parts_bridge.py             test_procenka_delivery_text.py             test_client_delivery_text_unified.py

      - name: Install isolated HTTP dependencies
        run: pip install 'fastapi>=0.110,<1' 'httpx>=0.27,<1'

      - name: Stage 4 admission, quiescence and paired release rehearsal
        run: python -B -m unittest -v test_dcp_admission.py test_dcp_release_rehearsal.py

      - name: Stage 3 producer protocol and single-writer consistency
        run: python -B -m unittest -v test_dcp_producer_v2.py test_dcp_stage3_consistency.py

      - name: Stage 2 atomic completion, recovery and actual adapters
        run: python -B -m unittest -v test_dp_result_completion.py test_dcp_three_adapters.py test_dcp_stage2_scope.py

      - name: DCP health regression
        run: |
          python -m unittest -v test_dcp_reliability.py test_dcp_health_core.py test_procenka_dp_bridge.py test_procenka_partial_parts_bridge.py test_procenka_delivery_text.py test_client_delivery_text_unified.py test_client_offer_card.py
