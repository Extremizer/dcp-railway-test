name: Theme1 OEMixi Unknown Manufacturer Enrollment

on:
  push:
    branches:
      - theme1-oemixi-unknown-enrollment-20261018
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-enrollment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install 'python-telegram-bot>=22.8,<23' 'websocket-client>=1.9,<2' 'playwright>=1.50'
      - name: Syntax smoke
        run: python -B -m py_compile oemixi_unknown_enrollment.py oemixibot_app.py test_oemixi_unknown_enrollment.py
      - name: Unknown manufacturer fail-closed tests
        run: python -B -m unittest -v test_oemixi_unknown_enrollment.py
      - name: OEMixi consumer regression
        run: python -B -m unittest -v test_oemixibot_admin_oem_search.py test_oemixi_shared_price_runtime.py
