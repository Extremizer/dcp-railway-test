name: Stage10 Mock Combined Gate
on:
  push:
    branches:
      - dcp-stage10-isolated-epoch-producer-20261022
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-price-three-bots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: python -m pip install -r requirements.txt pytest beautifulsoup4
      - name: Syntax and startup imports
        run: |
          python -B -m compileall -q dcp_authenticated_parts_search.py test_dcp_authenticated_parts_search.py dp_live_bridge.py dp_result_completion.py probnik_app.py extremizer_bot.py oemixibot_app.py oemixibot_catalog.py
          python -B -c "import dcp_authenticated_parts_search, probnik_app, extremizer_bot, oemixibot_app, dp_live_bridge, dp_result_completion"
      - name: Exact DCP signout email and Parts route
        run: python -B -m pytest -q test_dcp_authenticated_parts_search.py
      - name: Three bot manufacturer-first and ADMIN regressions
        run: python -B -m pytest -q test_manufacturer_first_three_bots.py test_oemixibot_admin_oem_search.py test_oemixibot_railway_runtime.py test_probnik_417127467_identity_failclosed.py test_probnik_417127467_signed_identity_e2e.py
      - name: DCP signed broker, completion, and identity guards
        run: python -B -m pytest -q test_dcp_admission.py test_dp_result_completion.py test_dcp_producer_v2.py test_dcp_health_core.py test_dcp_passive_guard.py test_oemixi_secure_gateway_transport.py test_oemixi_category_authority_cross_host.py test_polaris_dealer_session_identity_guard.py
      - name: Polaris cart and price contract regressions
        if: always()
        run: python -B -m pytest -q test_polaris_dealer_cart_contract.py test_polaris_dealer_cart_completion_contract.py test_polaris_cart_dom_layer_a.py test_polaris_cart_session_layer_c.py test_polaris_cart_exact_actions.py test_polaris_probe_cart_transaction.py test_polaris_consumer_pricesource.py
      - name: Stage 9 / 10 mock safety regression
        if: always()
        run: python -B -m pytest -q test_dcp_stage9_mock_linux_runner.py test_dcp_stage9_safety_closure.py test_dcp_stage10_ownership_epoch.py test_dcp_stage10_disabled_supplier.py test_dcp_stage10_epoch_broker_integration.py test_dcp_stage10_mock_producer_e2e.py
