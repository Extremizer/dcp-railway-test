name: Supplier Fulfillment Isolated Regression

on:
  push:
    branches: [supplier-warehouse-send-atomic-20261011]
  pull_request:
    branches: [probnik-runtime-20261005]

permissions:
  contents: read

jobs:
  supplier-fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP test dependencies
        run: pip install fastapi httpx python-multipart
      - name: Compile
        run: |
          python -m py_compile             stock_engine.py             fulfillment_slices.py             supplier_orders.py             supplier_shortages.py             supplier_order_service.py             supplier_delivery.py             supplier_api.py             supplier_telegram_admin.py             supplier_telegram_handlers.py             extremizer_bot.py             test_supplier_send_atomic_point5.py             test_supplier_confirm_assembly_point6.py             test_supplier_shipping_point7.py             test_supplier_delivered_point8.py
      - name: Supplier fulfillment regression
        run: |
          python -B -m unittest -v             test_supplier_send_atomic_point5.py             test_supplier_confirm_assembly_point6.py             test_supplier_shipping_point7.py             test_supplier_delivered_point8.py
      - name: WEB ADMIN 2 compatibility
        run: python -B run_web_admin_2_apply_regression.py
      - name: Checkout callback compatibility
        run: python -B _client_checkout_callback_adapter_regression.py
      - name: Finance switch compatibility
        run: python -B _prod_finance_switch_regression.py
