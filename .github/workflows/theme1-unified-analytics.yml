name: Theme1 Unified Analytics Isolated
on:
  push:
    branches: [theme1-unified-analytics-20261018]
  workflow_dispatch:
jobs:
  isolated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<0.29'
      - run: python -B -m unittest -v test_unified_analytics_isolated test_unified_analytics_outbox
