name: Production Finance Switch Gate

on:
  push:
    branches:
      - finance-live-switch-prod-gate-20261010

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact gate branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile production switch candidate
        run: |
          python -m py_compile             web1_runtime.py             web_app.py             probnik_app.py             extremizer_bot.py             oemixibot_finance.py             common_finance_contract.py             client_finance_adapter.py             client_finance_schema.py             client_order_finance_bridge.py             client_checkout_orchestrator.py             client_checkout_callback_adapter.py             _save_order_shared_tx_regression.py             _atomic_client_finance_regression.py             _client_checkout_orchestrator_regression.py             _client_checkout_callback_adapter_regression.py             _prod_finance_switch_regression.py
      - name: Run shared transaction regression
        run: python _save_order_shared_tx_regression.py
      - name: Run atomic client finance regression
        run: python _atomic_client_finance_regression.py
      - name: Run checkout orchestrator regression
        run: python _client_checkout_orchestrator_regression.py
      - name: Run callback adapter regression
        run: python _client_checkout_callback_adapter_regression.py
      - name: Run exact production port regression
        run: python _prod_finance_switch_regression.py
