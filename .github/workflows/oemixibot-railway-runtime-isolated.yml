name: OEMixiBOT Railway Runtime Isolated

on:
  push:
    branches:
      - oemixibot-railway-runtime-20261015
      - oemixibot-release-prep-20261015
      - oemixibot-theme5-readiness-followup-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  railway-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated dependencies
        run: pip install 'python-telegram-bot>=22.8,<23' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9' 'websocket-client>=1.9,<2' 'playwright>=1.50'

      - name: Syntax and import smoke
        run: |
          python -B -m py_compile             oemixibot_railway_runtime.py             oemixibot_railway_migration.py             oemixibot_railway_gateway_mount.py             oemixibot_poller_fence.py             oemixibot_windows_preflight.py             oemixi_secure_gateway_transport.py             unified_price_contract_v1.py             test_oemixibot_railway_runtime.py             test_theme5_stage2_mock_contract.py

      - name: Railway runtime migration freshness singleton E2E
        run: python -B -m unittest -v test_oemixibot_railway_runtime.py

      - name: Theme 5 Stage 2 mock contract
        run: python -B -m unittest -v test_theme5_stage2_mock_contract.py

      - name: Stage C1 targeted correction regressions
        run: python -B -m unittest -v test_oemixi_stage_c1_targeted_corrections.py

      - name: Secure transport runtime E2E and security matrix
        run: python -B -m unittest -v test_oemixi_secure_gateway_transport.py

      - name: Canonical price contract regressions
        run: |
          python -B -m unittest -v             test_unified_price_contract_v1.py             test_unified_price_adapters_v1.py

      - name: Admin OEM search and OEMixi shared gateway regressions
        run: |
          python -B -m unittest -v test_oemixibot_admin_oem_search.py
          python -B -m unittest -v test_oemixi_shared_price_runtime.py

      - name: Three consumers one claim
        run: python -B -m unittest -v test_dcp_three_adapters.py

      - name: Client pricing cards
        run: python -B -m unittest -v test_client_offer_card.py

      - name: Dealer and FinanceEngine regressions
        run: python -B -m unittest -v test_dealer_prepaid_finance.py test_oemixibot_prepaid_runtime.py

      - name: Client checkout regressions
        run: |
          python -B _atomic_client_finance_regression.py
          python -B _save_order_shared_tx_regression.py
          python -B _client_checkout_orchestrator_regression.py
          python -B _client_checkout_callback_adapter_regression.py
          python -B _prod_finance_switch_regression.py
