name: Theme1 OEMixi Dedicated Evidence Receiver
on:
  push:
    branches: [theme1-evidence-receiver-20261018]
  workflow_dispatch:
jobs:
  isolated-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install 'python-telegram-bot>=22.8,<23' 'websocket-client>=1.9,<2' 'playwright>=1.50' 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'httpx>=0.27,<0.29'
      - name: Syntax
        run: python -B -m py_compile oemixi_evidence_receiver_runtime.py test_oemixi_evidence_receiver_runtime.py oemixi_trusted_evidence_channel.py oemixi_trusted_evidence_producer_client.py
      - name: Receiver HTTP behavior
        run: python -B -m unittest -v test_oemixi_evidence_receiver_runtime.py test_oemixi_trusted_evidence_channel.py
      - name: OEMixi existing regression
        run: python -B -m unittest -v test_oemixibot_admin_oem_search.py test_oemixi_shared_price_runtime.py
