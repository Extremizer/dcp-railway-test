name: Isolated Linux DCP Browser Candidate
on:
  push:
    branches: [dcp-linux-live-producer-isolated-20261022]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Targeted candidate gate
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.34,<1' 'websocket-client>=1.9,<2' playwright
          python -m py_compile dcp_linux_live_isolated.py dcp_cloud_browser_host.py dcp_phone_recovery_app.py
          python -m unittest -v test_dcp_linux_live_isolated.py test_dcp_linux_admission.py
      - name: Docker build only - no deploy or DCP access
        run: docker build --file Dockerfile.dcp-live-isolated --tag dcp-live-candidate:ci .
