name: Isolated Linux DCP Browser Candidate
on:
  push:
    branches: [dcp-linux-live-producer-isolated-20261022]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Targeted candidate gate
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.34,<1' 'websocket-client>=1.9,<2' playwright
          python -m py_compile dcp_linux_live_isolated.py dcp_cloud_browser_host.py dcp_phone_recovery_app.py
          python -m unittest -v test_dcp_linux_live_isolated.py test_dcp_linux_admission.py test_dcp_linux_live_p0.py
      - name: Docker build only - no deploy or DCP access
        timeout-minutes: 15
        run: |
          timeout --signal=TERM --kill-after=10s 15m docker build --progress=plain --file Dockerfile.dcp-live-isolated --build-arg DCP_SOURCE_HEAD=${{ github.sha }} --tag dcp-live-candidate:ci .
          echo DOCKER_BUILD_PASS
      - name: Runtime smoke - network disabled and fail closed
        timeout-minutes: 2
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 60s docker run --rm --network none dcp-live-candidate:ci > smoke.log 2>&1
          code=$?
          set -e
          echo "CONTAINER_EXIT_CODE=$code"
          if [ "$code" -ne 24 ]; then
            echo "RUNTIME_SMOKE_FAIL_UNEXPECTED_EXIT"
            exit 1
          fi
          if ! grep -q 'LINUX_PRODUCER_BLOCKED' smoke.log; then
            echo "RUNTIME_SMOKE_FAIL_MARKER_MISSING"
            exit 1
          fi
          echo RUNTIME_SMOKE_FAIL_CLOSED_PASS
