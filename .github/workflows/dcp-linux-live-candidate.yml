name: Isolated Linux DCP Browser Candidate
on:
  push:
    branches: [dcp-linux-live-producer-isolated-20261022]
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Targeted candidate gate
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'uvicorn>=0.34,<1' 'websocket-client>=1.9,<2' playwright
          python -m py_compile dcp_linux_live_isolated.py dcp_cloud_browser_host.py dcp_phone_recovery_app.py
          python -m unittest -v test_dcp_linux_live_isolated.py test_dcp_linux_admission.py test_dcp_linux_live_p0.py
      - name: Docker build only - no deploy or DCP access
        run: |
          docker build --file Dockerfile.dcp-live-isolated --build-arg DCP_SOURCE_HEAD=${{ github.sha }} --tag dcp-live-candidate:ci .
          set +e
          output=$(docker run --rm --network none dcp-live-candidate:ci 2>&1)
          code=$?
          set -e
          test "$code" -eq 24
          echo "$output" | grep -q LINUX_PRODUCER_BLOCKED
          echo STAGING_ENTRY_FAIL_CLOSED_PASS
