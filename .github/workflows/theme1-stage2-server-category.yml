name: Theme1 Stage2 Server Category
on:
  push:
    branches:
      - theme1-stage2-server-category-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage2-server-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated dependencies
        run: pip install 'websocket-client>=1.7,<2'
      - name: Syntax and import
        run: |
          python -B -m py_compile dcp_category_authority.py dp_live_bridge.py dp_sync_agent.py dp_result_completion.py oemixibot_dcp_price.py test_theme1_stage2_server_category.py
          python -B -c 'import dp_live_bridge, dp_result_completion, dcp_category_authority, oemixibot_dcp_price'
      - name: SQLite request claim completion negative boundaries
        run: python -B -m unittest -v test_theme1_stage2_server_category.py
