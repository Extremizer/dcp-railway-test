name: OEMixi Stage C1 Targeted Corrections

on:
  push:
    branches:
      - oemixi-stage-c1-targeted-corrections-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: pip install 'python-telegram-bot>=22.8,<23' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9' 'websocket-client>=1.9,<2' 'playwright>=1.50'
      - name: Targeted BASE FAIL / FIX PASS
        run: python -B -m unittest -v test_oemixi_stage_c1_targeted_corrections.py
