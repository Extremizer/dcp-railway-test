name: Theme1 Polaris Probe Cart Isolated
on:
  push:
    branches:
      - theme4-polaris-p4-closure-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 websocket-client playwright
      - run: python -B -m py_compile polaris_cart_snapshot.py polaris_probe_cart_recovery.py polaris_probe_cart_transaction.py polaris_probe_cart_delta.py polaris_cart_mutation_adapter.py polaris_cart_exact_actions.py polaris_cart_existing_cdp_actions.py polaris_add_form_contract.py polaris_add_existing_session.py polaris_existing_browser_controller.py test_polaris_exact_add.py test_polaris_cart_exact_actions.py test_polaris_probe_cart_hardening.py test_polaris_probe_recovery_safety.py test_polaris_probe_cart_transaction.py
      - run: python -B -m unittest -v test_polaris_probe_cart_transaction.py test_polaris_cart_exact_actions.py test_polaris_exact_add.py test_polaris_probe_cart_hardening.py test_polaris_probe_recovery_safety.py test_polaris_dealer_session_identity_guard.py test_polaris_layer_c_runtime_wiring.py test_polaris_cart_session_layer_c.py test_polaris_cart_dom_layer_a.py test_polaris_dealer_cart_contract.py
