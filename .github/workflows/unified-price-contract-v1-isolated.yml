name: Unified Price Contract v1 Isolated

on:
  push:
    branches:
      - unified-price-contract-v1-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  price-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install isolated dependencies
        run: pip install 'python-telegram-bot>=22.8,<23' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'websocket-client>=1.9,<2' 'playwright>=1.50'

      - name: Syntax and import smoke
        run: |
          python -B - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              'unified_price_contract_v1.py',
              'unified_price_adapters_v1.py',
              'test_unified_price_contract_v1.py',
              'test_unified_price_adapters_v1.py',
              'oemixibot_app.py',
          ):
              path=Path(name)
              ast.parse(path.read_text(encoding='utf-8-sig'), filename=str(path))
          import unified_price_contract_v1, unified_price_adapters_v1
          PY

      - name: Canonical price contract and adapter regressions
        run: |
          python -B -m unittest -v             test_unified_price_contract_v1.py             test_unified_price_adapters_v1.py

      - name: Admin OEM search regression
        run: python -B -m unittest -v test_oemixibot_admin_oem_search.py

      - name: Shared gateway runtime and three-consumer regression
        run: |
          python -B -m unittest -v test_oemixi_shared_price_runtime.py
          python -B -m unittest -v test_dcp_three_adapters.py

      - name: Client pricing card regression
        run: python -B -m unittest -v test_client_offer_card.py

      - name: Dealer and FinanceEngine regressions
        run: python -B -m unittest -v test_dealer_prepaid_finance.py test_oemixibot_prepaid_runtime.py

      - name: Client checkout finance regressions
        run: |
          python -B _atomic_client_finance_regression.py
          python -B _save_order_shared_tx_regression.py
          python -B _client_checkout_orchestrator_regression.py
          python -B _client_checkout_callback_adapter_regression.py
          python -B _prod_finance_switch_regression.py
